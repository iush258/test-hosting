<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Hosting Website</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
        }
        header {
            background: #1e3a8a;
            color: white;
            padding: 20px;
            text-align: center;
        }
        nav {
            background: #111827;
            padding: 10px;
            text-align: center;
        }
        nav a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
            font-weight: bold;
        }
        nav a:hover {
            color: #60a5fa;
        }
        .container {
            padding: 40px;
            text-align: center;
        }
        .card {
            background: white;
            padding: 20px;
            margin: 20px auto;
            max-width: 400px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        button {
            padding: 10px 20px;
            border: none;
            background: #2563eb;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #1d4ed8;
        }
        footer {
            background: #111827;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 40px;
        }
    </style>
</head>
<body>

<header>
    <h1>My Test Hosting Website</h1>
    <p>Simple Website for Deployment Testing</p>
</header>

<nav>
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Services</a>
    <a href="#">Contact</a>
</nav>

<div class="container">
    <div class="card">
        <h2>Welcome 👋</h2>
        <p>This is a sample website created for testing hosting platforms like GitHub Pages, Netlify, or Vercel.</p>
        <button onclick="showMessage()">Click Me</button>
        <p id="message"></p>
    </div>
</div>

<footer>
    <p>© 2026 Test Hosting Website | All Rights Reserved</p>
</footer>

<script>
    function showMessage() {
        document.getElementById("message").innerText = "🎉 Your website is working perfectly!";
    }
</script>

</body>
</html>
